  --e1-stripe:rgba(255,255,255,.16);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --e1-stripe:rgba(255,255,255,.05); color-scheme:dark } }

  --e1-bg:#17142a; --e1-bg2:#1d1935; --e1-card:#242040; --e1-ink:#f1eefc; --e1-sub:#b3add0; --e1-faint:#7d7799; --e1-line:#322d52; --e1-soft:#2c2750; --e1-pri:#a48cff; --e1-pri2:#7c62e8; --e1-pri-ink:#17142a; --e1-pri-soft:#352d62; --e1-tile1:#3b3170; --e1-tile2:#2f2858; --e1-due:#f3bf5a; --e1-due-bg:#3a2e14; --e1-late:#ff8ea2; --e1-late-bg:#3e1d28; --e1-ok:#5ad89c; --e1-ok-bg:#183428; --e1-live:#4ade80;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--e1-bg);color:var(--e1-ink);font-family:var(--sans);font-size:16px;line-height:1.45;word-break:keep-all}
body:has(.app[data-board="e2"]){background:var(--e2-bg);color:var(--e2-ink)}
.app{min-height:100vh}
.app[data-board="e1"]{background:linear-gradient(170deg,var(--e1-bg2),var(--e1-bg));color:var(--e1-ink)}
.app[data-board="e2"]{background:radial-gradient(120% 80% at 50% 0%,var(--e2-bg2),var(--e2-bg));color:var(--e2-ink)}

.sw{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:12px 16px 0}
.sw-in{display:inline-flex;gap:2px;padding:4px;border-radius:999px}
.sw button{font:inherit;font-size:12.5px;font-weight:600;line-height:1.2;border:0;border-radius:999px;padding:7px 13px;background:transparent;cursor:pointer;white-space:nowrap}
.app[data-board="e1"] .sw-in{background:var(--e1-card)}
.app[data-board="e1"] .sw button{color:var(--e1-sub)}
.app[data-board="e1"] .sw button[aria-pressed="true"]{background:var(--e1-pri);color:var(--e1-pri-ink)}
.app[data-board="e1"] .sw button:focus-visible{outline:2px solid var(--e1-pri);outline-offset:2px}
.app[data-board="e2"] .sw-in{background:var(--e2-panel)}
.app[data-board="e2"] .sw button{color:var(--e2-sub)}
.app[data-board="e2"] .sw button[aria-pressed="true"]{background:var(--e2-acc);color:var(--e2-acc-ink)}
.app[data-board="e2"] .sw button:focus-visible{outline:2px solid var(--e2-acc);outline-offset:2px}

.e1 .phone{max-width:480px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.e1 .top{display:flex;justify-content:space-between;align-items:center}
.e1 .me{display:flex;gap:10px;align-items:center}
.e1 .bot{width:44px;height:44px;flex:none}
.e1 .me h1{margin:0;font-size:21px;font-weight:700}
.e1 .me .g{font-size:13.5px;color:var(--e1-sub)}
.e1 .pills{display:flex;gap:8px;align-items:center}
.e1 .clock{font-family:var(--mono);font-weight:700;font-size:16px;background:var(--e1-card);border-radius:999px;padding:8px 12px;font-variant-numeric:tabular-nums}
.e1 .bell{position:relative;width:40px;height:40px;border-radius:50%;background:var(--e1-card);display:grid;place-items:center;font-size:17px}
.e1 .bell i{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:999px;background:var(--e1-late);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.e1 .cta{display:flex;align-items:center;gap:12px;background:var(--e1-card);border-radius:999px;padding:8px 14px 8px 8px}
.e1 .cta .ic{width:40px;height:40px;border-radius:50%;background:var(--e1-pri);color:var(--e1-pri-ink);display:grid;place-items:center;font-size:17px;flex:none}
.e1 .cta b{display:block;font-size:15.5px}
.e1 .cta span{font-size:12.5px;color:var(--e1-sub)}
.e1 .cta .ar{margin-left:auto;color:var(--e1-sub);font-size:18px}
.e1 .cta.clear .ic{background:var(--e1-ok-bg);color:var(--e1-ok)}
.e1 .mon{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:700}
.e1 .mon small{font-size:12px;font-weight:500;color:var(--e1-sub)}
.e1 .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.e1 .dy{background:var(--e1-card);border-radius:999px;padding:9px 0 8px;text-align:center;font-size:12.5px;color:var(--e1-sub);position:relative}
.e1 .dy b{display:grid;place-items:center;width:32px;height:32px;margin:5px auto 0;border-radius:50%;font-size:14px;color:var(--e1-ink);font-weight:600;background:var(--e1-soft)}
.e1 .dy.today b{background:var(--e1-pri);color:var(--e1-pri-ink)}
.e1 .dy.past{opacity:.55}
.e1 .dy i{position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--e1-due)}
.e1 .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.e1 .tl{border-radius:18px;padding:10px 12px;background:linear-gradient(135deg,var(--e1-tile1),var(--e1-tile2));min-width:0;position:relative;overflow:hidden}
.e1 .tl::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,rgba(255,255,255,.16) 0 18px,transparent 18px 42px);pointer-events:none}
.e1 .tl .h{display:flex;gap:6px;align-items:baseline}
.e1 .tl .n{font-size:21px;font-weight:700}
.e1 .tl .s{font-size:11px;color:var(--e1-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e1 .tl .l{font-size:13px;font-weight:600;margin-top:4px}
.e1 .card{background:var(--e1-card);border-radius:22px;padding:14px 16px}
.e1 .brief h2{margin:0 0 6px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.e1 .live{font-size:12px;font-weight:600;border:1px solid var(--e1-line);border-radius:999px;padding:2px 10px;display:inline-flex;gap:6px;align-items:center;color:var(--e1-sub)}
.e1 .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--e1-live)}
.e1 .bl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;padding:7px 0}
.e1 .bl .k{font-size:12.5px;color:var(--e1-sub);font-style:italic}
.e1 .bl .v{font-size:15px;font-weight:600}
.e1 .bl .chip{grid-row:1/3;grid-column:2;align-self:center}
.e1 .chip{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.e1 .chip.due{background:var(--e1-due-bg);color:var(--e1-due)}
.e1 .chip.late{background:var(--e1-late-bg);color:var(--e1-late)}
.e1 .chip.ok{background:var(--e1-ok-bg);color:var(--e1-ok)}

.e1 .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.e1 .btn{border-radius:999px;padding:10px;text-align:center;font-weight:600;font-size:14.5px;border:1.5px solid var(--e1-pri);color:var(--e1-pri);background:transparent;cursor:pointer}
.e1 .btn.f{background:var(--e1-pri);color:var(--e1-pri-ink)}
.e1 .sec{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.e1 .sec h2{margin:0;font-size:19px;display:flex;gap:8px;align-items:center}
.e1 .cnt{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:999px;background:var(--e1-card);font-size:13px;font-weight:700;padding:0 8px}
.e1 .sec a{font-size:13.5px;color:var(--e1-sub)}
.e1 .task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;align-items:start;padding:12px 14px;border-radius:20px;background:var(--e1-card)}
.e1 .task.now{outline:2px solid var(--e1-pri)}
.e1 .task .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--e1-pri-soft);color:var(--e1-pri);grid-row:1/5;font-weight:700}
.e1 .tick{width:38px;height:38px;border-radius:50%;border:2px solid var(--e1-pri);background:transparent;color:var(--e1-pri);font-size:17px;cursor:pointer;display:grid;place-items:center;grid-row:1/5}
.e1 .tick:hover{background:var(--e1-pri);color:var(--e1-pri-ink)}
.e1 .task .tt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.e1 .task b{font-size:16px;line-height:1.35}
.e1 .facts{display:flex;flex-wrap:wrap;gap:5px}
.e1 .f{font-size:12px;border-radius:999px;padding:1px 9px;background:var(--e1-soft);color:var(--e1-sub);white-space:nowrap}
.e1 .f.w{background:var(--e1-pri);color:var(--e1-pri-ink);font-weight:600}
.e1 .impact{font-size:14px}
.e1 .impact::before{content:"안 하면 → ";color:var(--e1-late);font-weight:700}
.e1 .p{display:flex;gap:8px;align-items:center;min-width:0}
.e1 code{font-family:var(--mono);font-size:11.5px;color:var(--e1-sub);background:var(--e1-soft);border-radius:8px;padding:2px 8px;overflow-wrap:anywhere;min-width:0}
.e1 button{font:inherit;cursor:pointer}
.e1 .copy{flex:none;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--e1-line);background:var(--e1-card);color:var(--e1-sub)}
.e1 button:focus-visible{outline:2px solid var(--e1-pri);outline-offset:2px}
.e1 .list{display:grid;gap:10px}
.e1 .chat{display:grid;gap:10px}
.e1 .msg{display:grid;gap:4px;max-width:88%}
.e1 .msg.mine{justify-self:end}
.e1 .bub{border-radius:20px;padding:10px 14px;font-size:14.5px;background:var(--e1-card)}

.e1 .msg .when{font-size:11.5px;color:var(--e1-faint);display:flex;gap:6px;align-items:center}
.e1 .msg.mine .when{justify-content:flex-end}
.e1 .plan{background:var(--e1-card);border-radius:20px;padding:12px;display:grid;gap:8px}
.e1 .plan b.h{font-size:14px}
.e1 .pi{background:var(--e1-soft);border-radius:14px;padding:9px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px}
.e1 .pi .t{font-size:12.5px;color:var(--e1-sub);font-family:var(--mono)}
.e1 .pi .x{font-size:14.5px;font-weight:600}
.e1 .pi.done .x{text-decoration:line-through;color:var(--e1-faint);font-weight:500}
.e1 .pi .m{grid-row:1/3;grid-column:2;align-self:center;font-size:16px;color:var(--e1-sub)}
.e1 .auto{font-size:13px;color:var(--e1-sub);display:flex;flex-wrap:wrap;gap:4px 12px}
.e1 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.e1 .note{font-size:14px;color:var(--e1-late);background:var(--e1-late-bg);border-radius:12px;padding:8px 12px}
.e1 .foot{font-size:12px;color:var(--e1-faint);text-align:center}

.e2 .phone{max-width:480px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.e2 .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.e2 .top{display:flex;justify-content:space-between;align-items:center}
.e2 .top h1{margin:0;font-size:24px;font-weight:600}
.e2 .top h1 small{font-size:14px;color:var(--e2-sub);font-weight:500;margin-left:6px}
.e2 .rb{display:flex;gap:8px}
.e2 .circ{height:44px;min-width:44px;border-radius:999px;background:var(--e2-panel);display:grid;place-items:center;font-size:17px;padding:0 14px;font-family:var(--mono);font-weight:700}
.e2 .weekp{background:var(--e2-panel);border-radius:26px;padding:12px 10px 14px}
.e2 .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.e2 .wd{font-size:11.5px;color:var(--e2-faint);letter-spacing:.04em}
.e2 .dn{display:grid;place-items:center;width:38px;height:38px;margin:6px auto 0;border-radius:50%;font-size:17px;position:relative}
.e2 .today .dn{background:var(--e2-acc);color:var(--e2-acc-ink);font-weight:700}
.e2 .past .dn{color:var(--e2-faint)}
.e2 .dn i{position:absolute;bottom:-4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--e2-i3c)}
.e2 .sug{display:flex;gap:12px;align-items:center;background:var(--e2-sug);color:var(--e2-sug-ink);border-radius:24px;padding:14px 16px}
.e2 .sug .s{font-size:20px;flex:none}
.e2 .sug b{display:block;font-size:12px;font-weight:600;opacity:.8}
.e2 .sug span{font-size:15.5px;line-height:1.4}
.e2 .note{font-size:14px;color:var(--e2-late);background:var(--e2-panel);border-radius:12px;padding:8px 12px}
.e2 .list{background:var(--e2-panel);border-radius:26px;padding:4px 14px}
.e2 .row{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:13px 0;border-top:1px solid var(--e2-line)}
.e2 .row:first-child{border-top:0}
.e2 .row .t{font-family:var(--mono);font-size:13px;color:var(--e2-faint);align-self:start;padding-top:2px}

.e2 .row b{font-size:16px;font-weight:600;line-height:1.35;display:block}
.e2 .row .x{min-width:0}
.e2 .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--e2-i1);color:var(--e2-i1c);flex:none}

.e2 .row.done b{text-decoration:line-through;color:var(--e2-faint);font-weight:500}
.e2 .row.done .r{color:var(--e2-faint)}
.e2 .row.nowl{grid-template-columns:54px minmax(0,1fr);padding:6px 0;border-top:0}

.e2 .sub{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.e2 .f{font-size:11.5px;border-radius:999px;padding:1px 9px;background:var(--e2-acc-soft);color:var(--e2-acc);white-space:nowrap}
.e2 .f.w{background:var(--e2-acc);color:var(--e2-acc-ink);font-weight:600}
.e2 .f.h{background:var(--e2-i3);color:var(--e2-i3c)}
.e2 .impact{font-size:13.5px;color:var(--e2-sub);margin-top:4px}
.e2 .impact::before{content:"안 하면 → ";color:var(--e2-late);font-weight:700}
.e2 .tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--e2-acc);background:transparent;color:var(--e2-acc);font-size:18px;cursor:pointer;display:grid;place-items:center}
.e2 .tick:hover{background:var(--e2-acc);color:var(--e2-acc-ink)}
.e2 .p{display:flex;gap:8px;align-items:center;min-width:0;margin-top:4px}
.e2 code{font-family:var(--mono);font-size:11.5px;color:var(--e2-sub);background:var(--e2-row);border:1px solid var(--e2-line);border-radius:8px;padding:2px 8px;overflow-wrap:anywhere;min-width:0}
.e2 button{font:inherit;cursor:pointer}
.e2 .copy{flex:none;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--e2-line);background:var(--e2-panel);color:var(--e2-sub)}

<script>
(function(){
  
  var KIND={click:'버튼',decide:'결정',look:'확인',answer:'답'};
  var ST={run:'진행',wait:'대기',stop:'막힘',idle:'쉼'};
  var db=null, cards=[], meta=null, canWrite=true;
  function el(t,c,x){var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;}
  function ME(){ return (meta&&meta.me)||'나'; }
  function AG(){ return (meta&&meta.agent)||'비서'; }
  function pad(n){return ('0'+n).slice(-2);}
  function hm(s){var m=/^(\d{1,2}):(\d{2})$/.exec(s||''); return m?(+m[1])*60+(+m[2]):null;}
  function nowMin(){var d=new Date(); return d.getHours()*60+d.getMinutes();}
  function hhmm(m){return pad(Math.floor(m/60))+':'+pad(m%60);}
  function daysTo(date){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(date||''); if(!m)return null; var t=new Date(+m[1],+m[2]-1,+m[3]),n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/864e5);}
  function span(min){ if(min<60) return min+'분'; var h=Math.floor(min/60),m=min%60; return h+'시간'+(m?' '+m+'분':''); }
  function dname(n){ return n===null?'':(n<0?'지남':(n===0?'오늘':(n===1?'내일':'D-'+n))); }
  function range(){ var d=(meta&&meta.day)||{}; var s=hm(d.start)||540, e=hm(d.end)||1140; return e>s?[s,e]:[540,1140]; }
  function linkedDue(c){ return c['for']?cards.filter(function(x){return x.id===c['for'];})[0]:null; }
  function urg(c){ var t=hm(c.by); if(t!=null) return t-nowMin(); var d=daysTo(c.by); if(d!=null) return d*1440; var du=linkedDue(c); if(du){ var n=daysTo(du.date); if(n!=null) return n*1440+600; } return (c.waiting?1e5:1e6)+(c.order||0); }
  
  function soon(c){ var t=hm(c.by); if(t!=null) return [c.by+'까지',true]; var d=daysTo(c.by); if(d!=null) return [dname(d)+'까지',d<=1]; var du=linkedDue(c); if(du){ var n=daysTo(du.date); if(n!=null) return [dname(n)+' 마감',n<=1]; } return null; }
  function decisions(){ return cards.filter(function(c){ return (c.zone==='park' || (c.zone==='run' && c.needsMe)) && !c.answer; }).sort(function(a,b){return urg(a)-urg(b);}); }
  function nowList(){ return cards.filter(function(c){return c.zone==='now'&&!c.checked;}).sort(function(a,b){return (urg(a)-urg(b))||((a.order||0)-(b.order||0));}); }
  function nowChips(c){ var r=[]; if(c.waiting) r.push([c.waiting+' 기다림',1]); if(c.effort) r.push(['걸림 '+c.effort,0]); var a=hm(c.at); if(a!=null&&nowMin()>=a) r.push([(nowMin()-a<1?'방금':span(nowMin()-a)+'째')+' 대기',0]); var s=soon(c); if(s) r.push([s[0],s[1]?1:0]); return r; }
  function copyBtn(path){ var cp=el('button','cpy','경로 복사'); cp.type='button'; cp.title=path;
    cp.addEventListener('click',function(){ var ok=function(){cp.textContent='복사됨'; setTimeout(function(){cp.textContent='경로 복사';},1500);};
      try{ navigator.clipboard.writeText(path).then(ok,function(){ cp.textContent=path; }); }catch(e){ cp.textContent=path; } }); return cp; }

  ['pc','mobile'].forEach(function(x){ document.getElementById('ly-'+x).addEventListener('click',function(){ if(lay!==x){ setLay(x,true); render(); focusNow(); } }); });
  setLay(lay,false); show(cur,false); setInterval(render,60000);

  
  /* ═══ 자료 어댑터 — 세 갈래. 화면 코드는 db.doc('cards/<id>').update(f) 하나로 쓰고, 갈래마다 그 모양을 맞춰 준다 ═══
     ① claude.ai Artifact: window.claude.use('db') — cards 모음 + meta/board 한 장, 실시간. 답 알림 = Artifact 댓글(sendToClaude)
     ② 내 PC 서버(tools/board.py serve): GET /api/board 3초마다, ✓·답 = POST /api/card/<id>(고칠 칸만). 서버가 inbox/에 한 장 남김
     ③ 파일만 열기(file://): board-data.js(window.__BOARD__ = {...})를 5초마다 다시 읽음. 읽기 전용 */
  var MODE='', seen=false, lastSig='', fails=0, slow=null;
  function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  /* 날짜 칸에 'today', 'today+3', 'today-2'를 쓰면 여는 날 기준으로 바꿔 읽는다(예시 자료가 날짜가 지나도 살아 있게) */
  function rel(v){ var m=/^today([+-]\d+)?$/.exec(v||''); if(!m) return v; var d=new Date(); d.setDate(d.getDate()+(+(m[1]||0))); return ymd(d); }
  /* 시각 칸에 'now', 'now-25'(분)을 쓰면 여는 시각 기준 HH:MM으로 */
  function relT(v){ var m=/^now([+-]\d+)?$/.exec(v||''); if(!m) return v; var t=Math.max(0,Math.min(1439,nowMin()+(+(m[1]||0)))); return hhmm(t); }
  function norm(c){ ['at','since','checkedAt','answeredAt','eta'].forEach(function(k){ if(c[k]) c[k]=relT(c[k]); }); if(c.date) c.date=rel(c.date); if(c.by&&!/^\d{1,2}:\d{2}$/.test(c.by)) c.by=rel(c.by); if(c.answerDate) c.answerDate=rel(c.answerDate); return c; }
  function normMeta(m){ if(!m) return m; m=Object.assign({},m); if(m.updated) m.updated=relT(m.updated); if(Array.isArray(m.cal)) m.cal=m.cal.map(function(x){ return x?Object.assign({},x,{date:rel(x.date)}):x; }); return m; }
  function emptyHint(){
    var ro=MODE==='static'?' 지금은 읽기 전용이에요 — 같은 폴더에서 python tools/board.py serve 를 켜고 그 주소로 열면 ✓·답을 할 수 있어요.':'';
    if(cards.length){ showNote(ro.trim(),'info'); return; }
    showNote('아직 상황판 자료가 없어요. '+(MODE==='artifact'?'에이전트에게 "오늘 상황판 채워 줘"라고 말해 보세요.':'python tools/board.py init 으로 예시를 넣거나, 에이전트에게 "오늘 상황판 채워 줘"라고 말해 보세요.')+ro,'info'); }
  function applyBoard(b){ var cs=(b&&b.cards)||{};
    var arr=Array.isArray(cs)?cs.map(function(c){return norm(Object.assign({},c));}):Object.keys(cs).map(function(k){ var o=norm(Object.assign({},cs[k])); o.id=k; return o; });
    var m=normMeta((b&&b.meta)||null), sig=JSON.stringify([m,arr]); if(sig===lastSig) return; lastSig=sig; meta=m; cards=arr;
    render(); emptyHint(); if(!seen){ seen=true; focusNow(); } }
  /* ② 서버 */
  function apiGet(){ return fetch('/api/board',{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); }); }
  function pollServer(){ return apiGet().then(function(b){ if(fails>=3) emptyHint(); fails=0; applyBoard(b); },function(){ if(++fails===3) showNote('서버(python tools/board.py serve)에 닿지 못했어요. 켜져 있는지 봐 주세요. 다시 닿으면 저절로 이어집니다.'); }); }
  function serverDb(){ return { doc:function(path){ var id=String(path).split('/').slice(1).join('/'); return { update:function(f){
    return fetch('/api/card/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)}).then(function(r){
      if(!r.ok){ var e=new Error('http '+r.status); e.code=(r.status===404?'not_found':'http_'+r.status); throw e; } return r.json().catch(function(){return null;}); }).then(function(x){ pollServer(); return x; }); } }; } }; }
  /* ③ 파일만 */
  function loadStatic(){ var sc=document.createElement('script'); sc.src='board-data.js?t='+Date.now();
    sc.onload=function(){ sc.remove(); if(window.__BOARD__) applyBoard(window.__BOARD__); else showNote('board-data.js 안에 자료가 없어요(window.__BOARD__).'); };
    sc.onerror=function(){ sc.remove(); showNote('board-data.js를 찾지 못했어요. 이 폴더에서 python tools/board.py init 을 먼저 실행해 주세요.'); };
    (document.head||document.body).appendChild(sc); }
  function startStatic(){ MODE='static'; db=null; canWrite=false; render(); loadStatic(); setInterval(loadStatic,5000); }
  function startFile(){ if(/^https?:$/.test(location.protocol)) apiGet().then(function(b){ MODE='server'; db=serverDb(); canWrite=true; applyBoard(b); if(!cards.length) emptyHint(); setInterval(pollServer,3000); },startStatic); else startStatic(); }
  /* ① Artifact — 원본과 같은 구독 */
  function startArtifact(d){ MODE='artifact'; db=d;
    db.collection('cards').onSnapshot(function(snap){ cards=snap.docs.map(function(x){var o=norm(Object.assign({},x.data())); o.id=x.id; return o;}); if(!snap.metadata.fromCache){ clearTimeout(slow); emptyHint(); } render(); if(!seen){ seen=true; focusNow(); } }, function(){ clearTimeout(slow); showNote('상황판 자료 연결이 끊겼습니다. 페이지를 새로 열어 주세요.'); });
    db.doc('meta/board').onSnapshot(function(x){ meta=normMeta(x.exists?x.data():null); render(); },function(){}); }
  if(window.claude&&window.claude.use){
    slow=setTimeout(function(){ showNote('상황판 자료에 아직 닿지 못했습니다. 연결되면 저절로 채워집니다.'); },10000);
    window.claude.use('db').then(function(d){ if(d) startArtifact(d); else { clearTimeout(slow); MODE='artifact'; showNote('이 화면에서는 상황판 자료를 읽을 수 없습니다. 로그인한 브라우저에서 열어 주세요.'); } },
      function(){ clearTimeout(slow); showNote('상황판 자료를 읽지 못했습니다.'); });
  } else startFile();
})();
</script>
